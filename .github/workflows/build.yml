name: build

# Controls when the action will run
on:

  # Trigger the workflow on all pushes, except on tag creation
  push:
   branches:
   - '**'
   tags-ignore:
   - '**'

  # Trigger the workflow on all pull requests
  pull_request: ~

  # Allow workflow to be dispatched on demand
  workflow_dispatch: ~

env:
  ECRAD_TOOLS: ${{ github.workspace }}/.github/tools
  CTEST_PARALLEL_LEVEL: 1
  CACHE_SUFFIX: v1        # Increase to force new cache to be created

jobs:
  ci:
    name: ci

    strategy:
      fail-fast: false    # false: try to complete all jobs

      matrix:
        build_type: [Release,Bit,Debug]
        name:
          - linux gnu-13
          - linux nvhpc-25.9
          - linux intel-classic
          - linux intel-llvm

        include:

          - name: linux gnu-13
            os: ubuntu-24.04
            compiler: gnu-13
            compiler_cc: gcc-13
            compiler_cxx: g++-13
            compiler_fc: gfortran-13
            caching: true

          - name: linux nvhpc-25.9
            os: ubuntu-24.04
            compiler: nvhpc
            compiler_cc: nvc
            compiler_cxx: nvc++
            compiler_fc: nvfortran
            caching: true
            deps_cache_suffix: v2-haswell
            # caching: false

          # -fast otherwise selects the build runner's CPU, which may differ
          # from the CPU used to run the tests on GitHub-hosted runners.
          - name: linux nvhpc-25.9
            build_type: Bit
            cmake_options: -DECBUILD_Fortran_FLAGS_BIT=-tp=haswell

          - name: linux nvhpc-25.9
            build_type: Release
            cmake_options: -DECBUILD_Fortran_FLAGS_RELEASE=-tp=haswell

          - name : linux intel-classic
            os: ubuntu-22.04
            compiler: intel-classic
            compiler_cc: icc
            compiler_cxx: icpc
            compiler_fc: ifort
            caching: true

          - name : linux intel-llvm
            os: ubuntu-24.04
            compiler: intel-llvm
            compiler_cc: icx
            compiler_cxx: icpx
            compiler_fc: ifx
            caching: true

          # SPARTACUS solver tests are prohibitively slow with Intel Debug
          # builds (-O0 -check all) due to expensive matrix exponentials,
          # exceeding CI timeout limits. Correctness is covered by Release/BIT.
          - name: linux intel-classic
            build_type: Debug
            ctest_options: "-E spartacus"

          - name: linux intel-llvm
            build_type: Debug
            ctest_options: "-E spartacus"

    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Environment
      run:  |
        echo "DEPS_DIR=${{ runner.temp }}/deps" >> $GITHUB_ENV
        echo "CC=${{ matrix.compiler_cc }}"     >> $GITHUB_ENV
        echo "CXX=${{ matrix.compiler_cxx }}"   >> $GITHUB_ENV
        echo "FC=${{ matrix.compiler_fc }}"     >> $GITHUB_ENV

        # HDF5 and NetCDF are built separately from ecRad. Pin their CPU target
        # too: a cached NVHPC HDF5 library used AVX-512 on a runner without it.
        if [[ "${{ matrix.compiler }}" == "nvhpc" ]]; then
          echo "CFLAGS=-tp=haswell"   >> $GITHUB_ENV
          echo "CXXFLAGS=-tp=haswell" >> $GITHUB_ENV
          echo "FFLAGS=-tp=haswell"   >> $GITHUB_ENV
          echo "FCFLAGS=-tp=haswell"  >> $GITHUB_ENV
        fi

        if [[ "${{ matrix.os }}" =~ macos ]]; then
          brew install ninja
        else
          sudo apt-get update
          sudo apt-get install ninja-build libcurl4-openssl-dev
        fi

        printenv

    - name: Cache Dependencies
      if: matrix.caching
      id: deps-cache
      uses: actions/cache@v4
      with:
        path: ${{ env.DEPS_DIR }}
        key: deps-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.build_type }}-${{ matrix.deps_cache_suffix || env.CACHE_SUFFIX }}

    # Free up disk space for nvhpc
    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@main
      if: contains( matrix.compiler, 'nvhpc' )
      continue-on-error: true
      with:
        # this might remove tools that are actually needed,
        # if set to "true" but frees about 6 GB
        tool-cache: false

        # all of these default to true, but feel free to set to
        # "false" if necessary for your workflow
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: Install NVHPC compiler
      if: contains( matrix.compiler, 'nvhpc' )
      shell: bash -eux {0}
      run: |
        ${ECRAD_TOOLS}/install-nvhpc.sh --prefix /opt/nvhpc --version 25.9
        source /opt/nvhpc/env.sh
        echo "${NVHPC_DIR}/compilers/bin" >> $GITHUB_PATH
        echo "NVHPC_ROOT=${NVHPC_DIR}" >> $GITHUB_ENV

    - name: Install Intel Classic compiler
      if: contains( matrix.compiler, 'intel-classic' )
      run: |
        ${ECRAD_TOOLS}/install-intel-classic.sh
        source /opt/intel/oneapi/setvars.sh
        printenv >> $GITHUB_ENV
        echo "CACHE_SUFFIX=$CC-$($CC -dumpversion)" >> $GITHUB_ENV

    - name: Install Intel LLVM compiler
      if: contains( matrix.compiler, 'intel-llvm' )
      run: |
        ${ECRAD_TOOLS}/install-intel-llvm.sh
        source /opt/intel/oneapi/setvars.sh
        printenv >> $GITHUB_ENV
        echo "CACHE_SUFFIX=$CC-$($CC -dumpversion)" >> $GITHUB_ENV

    - name: Install HDF5
      run: |
        if [[ -f ${{ env.DEPS_DIR }}/hdf5/lib/libhdf5.settings ]]; then
          echo "::debug::HDF5 restored from cache"
        else
          ${ECRAD_TOOLS}/install-hdf5.sh --prefix ${{ env.DEPS_DIR }}/hdf5
        fi
        echo "HDF5_ROOT=${{ env.DEPS_DIR }}/hdf5" >> $GITHUB_ENV

    - name: Install NetCDF C
      run: |
        if [[ -f ${{ env.DEPS_DIR }}/netcdf/bin/nc-config ]]; then
          echo "::debug::NetCDF C restored from cache"
        else
          ${ECRAD_TOOLS}/install-netcdf-c.sh --prefix ${{ env.DEPS_DIR }}/netcdf --hdf5-root ${HDF5_ROOT}
        fi
        echo "NETCDF_ROOT=${{ env.DEPS_DIR }}/netcdf" >> $GITHUB_ENV

    - name: Install NetCDF Fortran
      run: |
        if [[ -f ${NETCDF_ROOT}/bin/nf-config ]]; then
          echo "::debug::NetCDF Fortran restored from cache"
        else
          ${ECRAD_TOOLS}/install-netcdf-fortran.sh --prefix ${{ env.DEPS_DIR }}/netcdf --netcdf-root ${NETCDF_ROOT}
        fi

    - name: Build & Test
      id: build-test
      uses: ecmwf-actions/build-package@v2
      with:
        save_cache: false
        self_coverage: false
        force_build: true
        cache_suffix: "${{ matrix.build_type }}-${{ env.CACHE_SUFFIX }}"
        recreate_cache: ${{ matrix.caching == false }}
        dependencies: |
          ecmwf/ecbuild
          ecmwf-ifs/fiat
          ecmwf-ifs/field_api@refs/heads/main
        dependency_branch: develop
        dependency_cmake_options: |
          ecmwf-ifs/fiat: "-G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DENABLE_TESTS=OFF"
          ecmwf-ifs/field_api: "-G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DENABLE_TESTS=OFF"
        cmake_options:    "-G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} ${{ matrix.cmake_options }} -DENABLE_SINGLE_PRECISION=ON -DENABLE_BITIDENTITY_TESTING=ON"
        self_build: true
        self_test: false

    - name: Run Tests
      shell: bash
      run: |
        if [[ "$(uname)" != "Darwin" ]]; then
          ulimit -s unlimited
        fi
        ctest -VV  --output-on-failure ${{ matrix.ctest_options }}
      working-directory: build

    - name: Diagnose NVHPC illegal instruction
      if: failure() && matrix.compiler == 'nvhpc' && matrix.build_type == 'Bit'
      working-directory: build/test/ifs.dp
      env:
        OMP_NUM_THREADS: '1'
      run: |
        command -v gdb >/dev/null || { sudo apt-get update && sudo apt-get install -y gdb; }
        lscpu
        if command -v nvcpuid >/dev/null; then nvcpuid; fi
        ldd "$GITHUB_WORKSPACE/build/bin/ecrad_dp"
        ulimit -s unlimited

        gdb -q -batch \
          -ex 'set pagination off' \
          -ex 'set disable-randomization off' \
          -ex 'run' \
          -ex 'bt' \
          -ex 'info symbol $pc' \
          -ex 'x/8i $pc' \
          -ex 'info sharedlibrary' \
          --args "$GITHUB_WORKSPACE/build/bin/ecrad_dp" \
          "$PWD/config_default.nam" \
          "$GITHUB_WORKSPACE/test/ifs/ecrad_meridian.nc" \
          output_ecrad_dp_default_diagnostic.nc

  make:
    name: Makefile build

    strategy:
      fail-fast: false    # false: try to complete all jobs

      matrix:
        name:
          - linux gnu

        include:

          - name: linux gnu
            os: ubuntu-24.04
            profile: gfortran

    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install libnetcdff-dev nco

    - name: Build & Test
      run: |
        make PROFILE=${{ matrix.profile }} -j
        make test PROFILE=${{ matrix.profile }}
