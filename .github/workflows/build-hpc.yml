name: build-hpc

on:
  # pull_request_target uses this trusted default-branch workflow while the
  # reusable workflow explicitly fetches the reviewed fork revision.
  pull_request_target:
    branches:
      - master-acc
      - master-omp
    types: [labeled]

permissions:
  contents: read

jobs:
  ci-hpc-master-acc:
    if: >-
      github.event.label.name == 'approved-for-ci' &&
      github.event.pull_request.base.ref == 'master-acc' &&
      github.event.pull_request.head.repo.fork
    uses: ./.github/workflows/build-hpc-reusable.yml
    with:
      matrix: |
        {"include":[
          {
            "name":"ac-gpu nvhpc",
            "site":"ac-batch",
            "troika_user_secret":"HPC_CI_SSH_USER",
            "sbatch_options":"#SBATCH --time=00:20:00\n#SBATCH --nodes=1\n#SBATCH --ntasks=2\n#SBATCH --cpus-per-task=32\n#SBATCH --gpus-per-task=1\n#SBATCH --mem=200G\n#SBATCH --qos=dg",
            "modules":"cmake,ninja,prgenv/nvidia,nvidia/24.5,netcdf4,python3",
            "cmake_options":"-G Ninja -DENABLE_OMP=OFF -DENABLE_ACC=ON"
          }
        ]}
    secrets: inherit

  ci-hpc-master-omp:
    if: >-
      github.event.label.name == 'approved-for-ci' &&
      github.event.pull_request.base.ref == 'master-omp' &&
      github.event.pull_request.head.repo.fork
    uses: ./.github/workflows/build-hpc-reusable.yml
    with:
      matrix: |
        {"include":[
          {
            "name":"ac-gpu nvhpc OpenACC",
            "site":"ac-batch",
            "troika_user_secret":"HPC_CI_SSH_USER",
            "sbatch_options":"#SBATCH --time=00:20:00\n#SBATCH --nodes=1\n#SBATCH --ntasks=2\n#SBATCH --cpus-per-task=32\n#SBATCH --gpus-per-task=1\n#SBATCH --mem=200G\n#SBATCH --qos=dg",
            "modules":"cmake,ninja,prgenv/nvidia,nvidia/24.5,netcdf4,python3",
            "cmake_options":"-G Ninja -DENABLE_OMP=OFF -DENABLE_ACC=ON"
          },
          {
            "name":"ac-gpu nvhpc OpenMP",
            "site":"ac-batch",
            "troika_user_secret":"HPC_CI_SSH_USER",
            "sbatch_options":"#SBATCH --time=00:20:00\n#SBATCH --nodes=1\n#SBATCH --ntasks=2\n#SBATCH --cpus-per-task=32\n#SBATCH --gpus-per-task=1\n#SBATCH --mem=200G\n#SBATCH --qos=dg",
            "modules":"cmake,ninja,prgenv/nvidia,nvidia/24.11,netcdf4,python3",
            "cmake_options":"-G Ninja -DENABLE_GPU=ON -DENABLE_ACC=OFF -DENABLE_OMP=ON"
          }
        ]}
    secrets: inherit
